  <style>
:root {
  --bg: #FFF8EC;
  --card: #FFFFFF;
  --ink: #2B2350;
  --muted: #6E6890;
  --line: #ECE4D6;
  --primary: #6C4CF1;
  --primary-ink: #FFFFFF;
  --accent: #FFB800;
  --ok: #2BB673;
  --ok-bg: #E3F7EC;
  --bad: #FF5A5F;
  --bad-bg: #FFE8E8;
  --g3: #FF8A3D; --g4: #F2B000; --g5: #2BB673; --g6: #2D9CDB; --g7: #6C4CF1; --g8: #E94C89;
  --radius: 22px;
  --shadow: 0 4px 0 rgba(43, 35, 80, .08), 0 10px 24px rgba(43, 35, 80, .06);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 18px; line-height: 1.45; min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--primary); }
h1 { font-size: 1.8rem; line-height: 1.15; margin: .4em 0 .5em; }
h2 { font-size: 1.25rem; margin: 1.2em 0 .5em; }
.emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.emoji.huge { font-size: 4rem; line-height: 1; }

/* ---- bovenbalk ---- */
.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: rgba(255, 248, 236, .92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 2px solid var(--line);
}
.logo { font-weight: 800; font-size: 1.25rem; color: var(--ink); text-decoration: none; display: flex; gap: 6px; align-items: center; }
.top-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.stars-pill { background: #FFF1C2; border-radius: 99px; padding: 4px 12px; font-weight: 700; white-space: nowrap; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow);
  font-size: 1.2rem; display: inline-grid; place-items: center; cursor: pointer; text-decoration: none; color: var(--ink);
}
.icon-btn[hidden] { display: none; }

main { max-width: 860px; margin: 0 auto; padding: 8px 16px 48px; outline: none; }

/* ---- algemene elementen ---- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer;
  border-radius: 16px; padding: 12px 20px; font: inherit; font-weight: 700; color: var(--ink); background: #EFEAFD;
  text-decoration: none; box-shadow: 0 4px 0 rgba(43, 35, 80, .12); transition: transform .08s, box-shadow .08s;
  min-height: 48px; touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 35, 80, .12); }
.btn:focus-visible, .key:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 4px 0 #4A2FC4; }
.btn.accent { background: var(--accent); color: var(--ink); box-shadow: 0 4px 0 #C78F00; }
.btn.danger { background: var(--bad-bg); color: #B3261E; }
.btn.big { font-size: 1.15rem; padding: 14px 24px; min-height: 58px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
.row.sticky { position: sticky; bottom: 12px; }
.crumb { font-size: .95rem; margin-top: 8px; }
.foot { text-align: center; color: var(--muted); margin-top: 32px; font-size: .95rem; }

/* ---- home ---- */
.hero { display: flex; gap: 16px; align-items: center; margin: 12px 0 18px; }
.hero h1 { margin: 0; }
.hero p { margin: 4px 0 0; color: var(--muted); }
.avatar { font-size: 3.2rem; width: 84px; height: 84px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.tile {
  display: flex; flex-direction: column; gap: 2px; padding: 20px; border-radius: var(--radius); color: #fff;
  text-decoration: none; box-shadow: var(--shadow); min-height: 140px; transition: transform .1s;
}
.tile:active { transform: scale(.97); }
.tile .emoji { font-size: 2.4rem; }
.tile b { font-size: 1.2rem; margin-top: auto; }
.tile small { opacity: .92; }
.tile:first-child { grid-column: span 2; }
.t1 { background: linear-gradient(135deg, #6C4CF1, #8F6BFF); }
.t2 { background: linear-gradient(135deg, #FF5A5F, #FF8A6A); }
.t3 { background: linear-gradient(135deg, #2D9CDB, #56C2F0); }
.t4 { background: linear-gradient(135deg, #F29E00, #FFC233); color: var(--ink); }
.t5 { background: linear-gradient(135deg, #2BB673, #5AD69A); }
.install { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.install .emoji { font-size: 2rem; }
.install div { flex: 1; min-width: 180px; display: flex; flex-direction: column; }
.install small { color: var(--muted); }

/* ---- groepen & onderwerpen ---- */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.tab { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--card); text-decoration: none; color: var(--ink); font-weight: 700; box-shadow: var(--shadow); border: 3px solid transparent; }
.tab.on { color: #fff; }
.g3 { --g: var(--g3); } .g4 { --g: var(--g4); } .g5 { --g: var(--g5); } .g6 { --g: var(--g6); } .g7 { --g: var(--g7); } .g8 { --g: var(--g8); }
.tab.on { background: var(--g); }
.tab:not(.on) { border-color: var(--g); }
.topics { display: grid; gap: 12px; }
.topic {
  display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: var(--radius); padding: 14px 18px;
  text-decoration: none; color: var(--ink); box-shadow: var(--shadow); border-left: 8px solid var(--g);
}
.topic .emoji { font-size: 2rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: color-mix(in srgb, var(--g) 14%, white); flex: none; }
.topic .tt { flex: 1; display: flex; flex-direction: column; }
.topic small { color: var(--muted); }
.topic .st, .prog .st { color: var(--accent); font-size: 1.2rem; letter-spacing: 1px; white-space: nowrap; }
.topic.big { background: color-mix(in srgb, var(--g) 10%, white); }

/* ---- uitleg ---- */
.uitleg { border-top: 8px solid var(--g, var(--primary)); margin-bottom: 16px; }
.uitleg h2 { margin-top: 0; }
.uitleg ul, .uitleg ol { padding-left: 1.3em; }
.uitleg li { margin: .25em 0; }
.voorbeeld { background: #F5F1FF; border-radius: 14px; padding: 10px 14px; margin: 10px 0; font-size: 1.1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.voorbeeld .pie { width: 70px; height: 70px; }
.voorbeeldsom { text-align: center; margin-bottom: 16px; }
.voorbeeldsom h2 { margin-top: 0; font-size: 1rem; color: var(--muted); }
.vt { border-collapse: collapse; margin: 8px 0; font-size: 1.05rem; }
.vt th, .vt td { border: 2px solid var(--line); padding: 6px 12px; text-align: center; }
.vt th { background: #FAF6EE; text-align: left; }

/* ---- breuken ---- */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.05; margin: 0 .12em; font-size: .9em; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .15em; }

/* ---- oefenen / toets ---- */
.ex { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.ex-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ex-title { font-size: 1rem; }
.count { color: var(--muted); font-weight: 700; white-space: nowrap; }
.progress { height: 14px; background: #EDE6D8; border-radius: 99px; overflow: hidden; }
.bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #FF8A3D); border-radius: 99px; transition: width .3s; }
.qcard { text-align: center; padding: 24px 16px; }
.qcard.small { padding: 12px; }
.q { font-size: 1.9rem; font-weight: 800; line-height: 1.3; }
.q.big { font-size: 2.8rem; }
.q b { color: var(--primary); }
.qarea .q:not(:only-child) { margin-bottom: 12px; }
.qarea .q { font-size: clamp(1.25rem, 4.5vw, 1.9rem); }
.feedback { min-height: 1.5em; text-align: center; font-weight: 700; font-size: 1.15rem; border-radius: 16px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: #C2272D; background: var(--bad-bg); padding: 12px; }
.feedback .hint { color: var(--ink); font-weight: 500; font-size: 1rem; margin-top: 6px; }
.feedback .btn { margin-top: 10px; }
.display-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; }
.display {
  min-width: 180px; max-width: 100%; min-height: 72px; padding: 8px 20px; border-radius: 18px; background: var(--card);
  border: 3px solid var(--primary); font-size: 2.4rem; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center;
}
.display .ph { color: #CFC7E8; }
.unit { font-size: 1.6rem; font-weight: 800; color: var(--muted); }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 420px; margin: 12px auto 0; width: 100%; }
.key {
  font: inherit; font-size: 1.7rem; font-weight: 800; border: 0; border-radius: 16px; background: var(--card); color: var(--ink);
  height: 64px; box-shadow: 0 4px 0 rgba(43, 35, 80, .12); cursor: pointer; touch-action: manipulation;
}
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 35, 80, .12); }
.key.del { background: #FFE9D6; }
.key.ok { grid-column: span 3; background: var(--ok); color: #fff; box-shadow: 0 4px 0 #1E8A56; font-size: 1.4rem; }
.choices { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 560px; margin: 0 auto; width: 100%; }
.choices.four { grid-template-columns: 1fr 1fr; }
.choices.three { grid-template-columns: repeat(3, 1fr); margin-top: 16px; }
.choice { font-size: 1.4rem; min-height: 72px; background: var(--card); }
.choice.sym { font-size: 2.4rem; }
.choice.ok { background: var(--ok); color: #fff; }
.choice.bad { background: var(--bad); color: #fff; }
.choice.picked { background: var(--primary); color: #fff; }
.choice:disabled { opacity: .8; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* ---- plaatjes ---- */
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 330px; margin: 0 auto; }
.dots i { width: 24px; height: 24px; border-radius: 50%; display: block; }
.dots .d1 { background: var(--bad); }
.dots .d2 { background: var(--g6); }
.dots .dx { background: #E5DFD3; position: relative; }
.dots .dx::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: #A39A8A; font-style: normal; }
.split { display: inline-flex; flex-direction: column; align-items: center; margin: 4px auto; font-weight: 800; font-size: 1.6rem; }
.split .roof { width: 152px; height: 62px; background: var(--bad); clip-path: polygon(50% 0, 100% 100%, 0 100%); color: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
.split .rooms { display: grid; grid-template-columns: 1fr 1fr; width: 152px; border: 4px solid var(--ink); border-top: 0; }
.split .rooms div { padding: 8px; text-align: center; background: #fff; }
.split .rooms div + div { border-left: 4px solid var(--ink); }
.clock { width: min(220px, 60vw); height: auto; display: block; margin: 0 auto; }
.clock .face { fill: #fff; stroke: var(--ink); stroke-width: 3; }
.clock .tick { stroke: #B9B2CF; stroke-width: 1; }
.clock .tick.big { stroke: var(--ink); stroke-width: 2; }
.clock .num { font-size: 9px; font-weight: 800; text-anchor: middle; fill: var(--ink); font-family: var(--font); }
.clock .hand { stroke-linecap: round; }
.clock .hand.hour { stroke: var(--bad); stroke-width: 5; }
.clock .hand.min { stroke: var(--primary); stroke-width: 3; }
.clock .pin { fill: var(--ink); }
.pie { width: min(180px, 50vw); height: auto; display: block; margin: 0 auto; }
.pie path { stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.pie .on { fill: var(--accent); }
.pie .off { fill: #fff; }
.shapes { width: min(300px, 80vw); height: auto; display: block; margin: 0 auto; }
.shapes .shape { fill: color-mix(in srgb, var(--g6) 25%, white); stroke: var(--g6); stroke-width: 3; }
.shapes .corner { fill: none; stroke: var(--g6); stroke-width: 2; }
.shapes .lbl { font-size: 14px; font-weight: 800; text-anchor: middle; fill: var(--ink); font-family: var(--font); }

/* ---- resultaat ---- */
.result { text-align: center; margin-top: 16px; }
.bigscore { font-size: 3rem; font-weight: 900; margin: 0; color: var(--primary); }
.bigscore small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.cijfer { font-size: 1.2rem; }
.cijfer b { color: var(--primary); }
.review { list-style: none; padding: 0; text-align: left; display: grid; gap: 10px; }
.review li { background: #FAF6EE; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.review .rq { font-weight: 700; }
.review s { color: var(--bad); }
.review b { color: var(--ok); }
.review small { color: var(--muted); }
.review .rvis svg, .review .rvis .dots { width: 120px; max-width: 120px; margin: 0; }
.review .rvis .split { transform: scale(.7); transform-origin: left top; margin-bottom: -30px; }

/* ---- spelletjes ---- */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.game {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 20px; border-radius: var(--radius);
  background: var(--card); color: var(--ink); text-decoration: none; box-shadow: var(--shadow); border-top: 8px solid var(--c);
}
.game .emoji { font-size: 2.6rem; }
.game b { font-size: 1.2rem; }
.game small { color: var(--muted); }
.badge { position: absolute; top: 12px; right: 12px; background: #FFF1C2; border-radius: 99px; padding: 2px 10px; font-size: .85rem; font-weight: 700; }
.game-intro { text-align: center; margin-top: 16px; }
.game-intro p { max-width: 460px; margin: 8px auto 16px; }
.tafelkeuze { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 460px; margin: 0 auto; }
.tafelkeuze .btn { font-size: 1.4rem; min-height: 60px; }
.tafelkeuze .wide { grid-column: 1 / -1; }
.hud { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0 12px; }
.hud div { background: var(--card); border-radius: 16px; padding: 6px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; min-width: 96px; }
.hud small { color: var(--muted); font-size: .8rem; }
.hud b { font-size: 1.4rem; }
.sky {
  position: relative; height: min(62vh, 560px); margin-top: 12px; border-radius: var(--radius); overflow: hidden;
  background: linear-gradient(#BEE7FF, #E9F7FF 70%, #D7F2D0); touch-action: none; user-select: none; -webkit-user-select: none;
}
.balloon {
  position: absolute; top: 0; width: 76px; height: 92px; border: 0; padding: 0; cursor: pointer; will-change: transform;

'use strict';
/* Rekenraket – kern: hulpfuncties, vraag-bouwers, plaatjes en het register van oefeningen.

/* ===================== hulpfuncties ===================== */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  a = a.slice();

    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];

}
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const round = (n, d = 6) => Math.round(n * 10 ** d) / 10 ** d;
/* Nederlands getal: komma als decimaalteken. dots=true → punt als duizendtal-scheiding (12.500) */
function nl(n, dots = false) {
  const s = String(round(n, 6));
  if (!dots) return s.replace('.', ',');
  const [i, d] = s.split('.');
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : '');
}
const euro = n => '€ ' + n.toFixed(2).replace('.', ',');
function fracStr(n, d) {
  const g = gcd(n, d);
  n /= g; d /= g;
  return d === 1 ? String(n) : n + '/' + d;
}
function fracHTML(s) {
  return String(s).replace(/(\d+)\/(\d+)/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
}
const NAMEN = ['Noah', 'Emma', 'Sem', 'Julia', 'Liam', 'Mila', 'Daan', 'Tess', 'Finn', 'Sara', 'Mohammed', 'Yara', 'Luuk', 'Zoë', 'Lucas', 'Nora', 'Adam', 'Fenna'];
const MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
const DAGEN = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];

/* ===================== getallen in woorden ===================== */
const W_EEN = ['nul', 'een', 'twee', 'drie', 'vier', 'vijf', 'zes', 'zeven', 'acht', 'negen', 'tien', 'elf', 'twaalf', 'dertien', 'veertien', 'vijftien', 'zestien', 'zeventien', 'achttien', 'negentien'];
const W_TIEN = ['', '', 'twintig', 'dertig', 'veertig', 'vijftig', 'zestig', 'zeventig', 'tachtig', 'negentig'];
function w100(n) {
  if (n < 20) return W_EEN[n];
  const t = Math.floor(n / 10), e = n % 10;
  if (!e) return W_TIEN[t];
  return W_EEN[e] + (e === 2 || e === 3 ? 'ën' : 'en') + W_TIEN[t];
}
function w1000(n) {
  if (n < 100) return w100(n);
  const h = Math.floor(n / 100), r = n % 100;
  return (h === 1 ? '' : W_EEN[h]) + 'honderd' + (r ? w100(r) : '');
}
/* 2345 → "tweeduizend driehonderdvijfenveertig", 1 → "één" */
function getalWoord(n) {
  n = Math.round(n);
  if (n === 0) return 'nul';
  if (n === 1) return 'één';
  const parts = [];
  const mld = Math.floor(n / 1e9), mln = Math.floor(n / 1e6) % 1000, dzd = Math.floor(n / 1000) % 1000, rest = n % 1000;
  if (mld) parts.push((mld === 1 ? 'één' : w1000(mld)) + ' miljard');
  if (mln) parts.push((mln === 1 ? 'één' : w1000(mln)) + ' miljoen');
  if (dzd) parts.push((dzd === 1 ? '' : w1000(dzd)) + 'duizend');
  if (rest) parts.push(w1000(rest));
  return parts.join(' ');
}

/* ===================== vraag-bouwers ===================== */
/* Zie SPEC.md. Elke bouwer geeft een vraag-object terug. Extra velden via o (vis, unit, pre, frac, ...). */
function num(q, v, hint, o = {}) {
  return Object.assign({ type: 'num', q, v, a: nl(v, v >= 10000), hint }, o);
}
function choice(q, ans, wrongs, hint, o = {}) {
  ans = String(ans);
  const w = [...new Set(wrongs.map(String))].filter(x => x !== ans);
  const n = o.n || 3;
  return Object.assign({ type: 'choice', q, ans, a: ans, choices: shuffle([ans, ...shuffle(w).slice(0, n)]), hint }, o);
}
/* Meerdere invulvakjes: zet {{0}}, {{1}}, … in q of vis. blanks = goede antwoorden (getallen). */
function multi(q, blanks, hint, o = {}) {
  return Object.assign({ type: 'multi', q, blanks, a: blanks.map(b => nl(b, b >= 10000)).join(' · '), hint }, o);
}
/* Op volgorde tikken. items = weergaveteksten; values = getallen om op te sorteren. desc=true → groot naar klein */
function order(q, items, values, hint, o = {}) {
  const idx = items.map((_, i) => i).sort((a, b) => (o.desc ? values[b] - values[a] : values[a] - values[b]));

}
/* Tik de juiste plek op de getallenlijn. labels = getallen met een label; ticks = aantal streepjes-stappen */
function line(q, min, max, v, hint, o = {}) {

}

function clockSet(q, h, m, hint, o = {}) {

}
/* Juiste aantal plaatjes neerzetten */
function count(q, n, hint, o = {}) {
  return Object.assign({ type: 'count', q, n, emoji: o.emoji || '🍎', max: o.max || Math.max(10, n + 5), a: String(n), hint }, o);
}

function pay(q, amount, hint, o = {}) {
  return Object.assign({ type: 'pay', q, amount, money: o.money || [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000], a: euro(amount / 100), hint }, o);
}
/* Vakjes kleuren: cells vakjes (rows × cols of strook), n moeten gekleurd zijn */
function colour(q, cells, n, hint, o = {}) {
  return Object.assign({ type: 'colour', q, cells, n, cols: o.cols || cells, a: `${n} van de ${cells} vakjes`, hint }, o);
}
function nearWrongs(v, n = 3, step = 1) {
  const set = new Set();
  for (const d of shuffle([1, -1, 2, -2, 10, -10, 3, -3, 5, -5])) {
    const x = round(v + d * step);
    if (x >= 0 && x !== v) set.add(x);
    if (set.size >= n) break;
  }
  return [...set];
}

/* ===================== plaatjes (generiek) ===================== */
/* Plaatjes in groepjes van 5 (handig tellen) */
function plaatjes(n, emoji = '🍎', perRow = 10) {
  let s = `<div class="plaatjes" style="--per:${perRow}" aria-label="${n} plaatjes">`;
  for (let i = 0; i < n; i++) s += `<span class="${i % 5 === 4 ? 'p5' : ''}">${emoji}</span>`;
  return s + '</div>';
}
function dots(a, b, minus = false) {
  let s = '<div class="dots" aria-hidden="true">';
  if (minus) for (let i = 0; i < a; i++) s += `<i class="${i >= a - b ? 'dx' : 'd1'}"></i>`;
  else {
    for (let i = 0; i < a; i++) s += '<i class="d1"></i>';
    for (let i = 0; i < b; i++) s += '<i class="d2"></i>';
  }
  return s + '</div>';
}
function splitshuis(top, left, right) {
  return `<div class="split" aria-hidden="true"><div class="roof">${top}</div><div class="rooms"><div>${left}</div><div>${right}</div></div></div>`;
}
function clockSVG(h, m, cls = '') {
  let s = `<svg class="clock ${cls}" viewBox="0 0 100 100" role="img" aria-label="klok">`;
  s += '<circle cx="50" cy="50" r="46" class="face"/>';

/* Klok in woorden, per minuut ("zeven over half vier", "kwart voor vijf") */
function klokWoord(h, m) {

  const short = x => W_EEN[x];

  if (m === 15) return `kwart over ${H}`;

  if (m === 45) return `kwart voor ${N}`;
  if (m < 15) return `${m % 5 ? min(m) : short(m)} over ${H}`;

/* Munten en briefjes tekenen. list = bedragen in centen */
function moneyHTML(list) {
  return `<div class="money">${list.map(c => moneyItem(c)).join('')}</div>`;
}
function moneyItem(c, tag = 'span', attrs = '') {
  const note = c >= 500, label = c >= 100 ? '€' + c / 100 : c + 'c';

function tableHTML(rows, cls = '') {
  return `<table class="tbl ${cls}">${rows.map((r, i) => `<tr>${r.map(c => (i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`)).join('')}</tr>`).join('')}</table>`;

/* ===================== register ===================== */
const DOMAINS = [
  { id: 'automatiseren', title: 'Automatiseren', emoji: '⚡' },
  { id: 'getallen', title: 'Getallen', emoji: '🔢' },

'use strict';
/* Rekenraket – domein Getallen: getalbegrip tot 100, boven de 100 en kommagetallen.
   Categorieën: getal100, getalgroot, komma. Alle eigen globale namen beginnen met gt_. */

/* ===================== hulpjes ===================== */
const gt_EMO = ['🍎', '🐞', '⭐', '🐟', '🚗', '🌸', '🐣', '🍓', '⚽', '🎈', '🐸', '🧁', '🦋', '🍌'];
const gt_PL = ['eenheden', 'tientallen', 'honderdtallen', 'duizendtallen', 'tienduizendtallen', 'honderdduizendtallen'];
const gt_f = n => nl(n, true);
const gt_pow = p => Math.pow(10, p);

/* n verschillende waarden uit f() (stopt na een vast aantal pogingen) */
function gt_distinct(n, f, start = []) {
  const s = new Set(start);
  for (let t = 0; t < 400 && s.size < n; t++) s.add(f());
  return shuffle([...s]).slice(0, n);
}

/* Getallenrij met vakjes. vals = getallen; nb = aantal open vakjes. Er blijven altijd twee buren zichtbaar. */
function gt_row(vals, nb, fmt = gt_f) {

  let pos = null;
  for (let t = 0; t < 60 && !pos; t++) {
    const p = shuffle(vals.map((_, i) => i)).slice(0, nb).sort((a, b) => a - b);
    let ok = false;
    for (let i = 0; i < len - 1; i++) if (p.indexOf(i) < 0 && p.indexOf(i + 1) < 0) ok = true;

/* ===================== hulpjes ===================== */

const bw_dec = (n, d) => n.toFixed(d).replace('.', ',');
/* probeer fn tot ok(x); anders fallback */
function bw_gen(fn, ok, fb) {
  for (let i = 0; i < 400; i++) { const x = fn(); if (ok(x)) return x; }
  return fb;
}
const bw_digits = n => String(n).split('').reverse().map(Number);
/* is er bij a + b ergens een overschrijding (onthouden)? */
function bw_carry(a, b) {
  const x = bw_digits(a), y = bw_digits(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) + (y[i] || 0) >= 10) return true;
  return false;
}
/* moet je bij a − b ergens lenen? */
function bw_borrow(a, b) {
  const x = bw_digits(a), y = bw_digits(b);
  for (let i = 0; i < y.length; i++) if ((x[i] || 0) < y[i]) return true;
  return false;
}
const bw_UNIT = { 1: ['tiental', 'eenheden'], 10: ['honderdtal', 'tientallen'], 100: ['duizendtal', 'honderdtallen'] };

/* Hint voor a + b. u = 1 (tot 100), 10 (tientallen), 100 (honderdtallen) */
function bw_hintPlus(a, b, u = 1) {

  else { A = R(1001, 9999); da = 3; db = pick([1, 2, 3]); B = db === 1 ? 100 * R(1, 30) : db === 2 ? 10 * R(11, 300) : R(101, 3000); }
  if (A % 10 === 0) A += 1;

  <script>

   Alle eigen functies beginnen met mt_, alle CSS-klassen met mt- (zie css/ex-meten.css). */

/* ===================== algemene hulp ===================== */

  const h = Math.floor(min / 60), m = min % 60;
  const hs = h ? `${h} uur` : '', ms = m ? (m === 1 ? '1 minuut' : `${m} minuten`) : '';
  return h && m ? `${hs} en ${ms}` : hs || ms;
}
const mt_two = (a, la, b, lb) => `<div class="mt-two"><figure><figcaption>${la}</figcaption>${a}</figure><figure><figcaption>${lb}</figcaption>${b}</figure></div>`;
const mt_fig = (a, la) => `<div class="mt-two"><figure><figcaption>${la}</figcaption>${a}</figure></div>`;

];

function mt_khint(m) {
  if (m === 0) return 'De lange wijzer staat recht omhoog op de 12: dan is het een heel uur. De korte wijzer wijst het uur aan.';
  if (m === 30) return 'De lange wijzer staat op de 6: het is half. Let op: half betekent een half uur vóór het volgende uur.';
  if (m === 15 || m === 45) return 'Lange wijzer op de 3 = kwart over het uur. Lange wijzer op de 9 = kwart voor het volgende uur.';
  if (m % 5 === 0) return 'Elk cijfer is 5 minuten. Staat de lange wijzer dicht bij de 12? Dan zeg je "over" of "voor" het uur. Dicht bij de 6? Dan "voor half" of "over half".';
  return 'Elk streepje is 1 minuut. Tel de streepjes vanaf het dichtstbijzijnde cijfer: de 12, de 3, de 6 of de 9.';
}
function mt_dhint(h, m) {
  const a = h > 12 ? 'Is het uur groter dan 12? Haal er dan 12 af. ' : '';
  let b;

  else if (m === 30) b = '30 minuten is half. Half gaat altijd naar het vólgende uur.';
  else if (m === 15 || m === 45) b = '15 minuten = kwart over, 45 minuten = kwart voor het volgende uur.';
  else if (m < 15) b = `Het is ${m} minuten na het hele uur.`;

function mt_cal(y, mo, marks = []) {
  const first = (new Date(y, mo, 1).getDay() + 6) % 7, dim = new Date(y, mo + 1, 0).getDate();
  let s = `<table class="mt-cal"><caption>${MAANDEN[mo]} ${y}</caption><tr>${['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(d => `<th>${d}</th>`).join('')}</tr><tr>`;
  for (let i = 0; i < first; i++) s += '<td></td>';
  for (let d = 1; d <= dim; d++) {
    if (d > 1 && (first + d - 1) % 7 === 0) s += '</tr><tr>';
    s += `<td${marks.includes(d) ? ' class="mt-on"' : ''}>${d}</td>`;
  }
  return s + '</tr></table>';
}
const MT_RANG = ['eerste', 'tweede', 'derde', 'vierde'];
function mt_maandVolg() {

    const n = R(4, 5), ms = shuffle([...Array(12).keys()]).slice(0, n);
    return order('Zet de maanden in de goede volgorde. Begin bij de maand die het eerst komt in het jaar.', ms.map(i => MAANDEN[i]), ms,
      'Het jaar begint met januari, februari, maart … en eindigt met november en december.');
  }
  if (t === 1) {
    const mo = R(0, 11), k = pick([1, 1, 2, 3, -1, -1, -2]), ans = MAANDEN[(mo + k + 12) % 12];
    const q = k === 1 ? `Welke maand komt na <b>${MAANDEN[mo]}</b>?` : k === -1 ? `Welke maand komt vóór <b>${MAANDEN[mo]}</b>?`
      : k > 0 ? `Welke maand is het ${k} maanden na <b>${MAANDEN[mo]}</b>?` : `Welke maand was het 2 maanden vóór <b>${MAANDEN[mo]}</b>?`;
    const w = [-3, -2, -1, 0, 1, 2, 3].filter(x => x !== k).map(x => MAANDEN[(mo + x + 12) % 12]);
    return choice(q, ans, w, 'Zeg de maanden op een rij op. Na december begint het jaar weer bij januari.');
  }
  const mo = R(0, 11);

}
function mt_kalDag() {

  const wd = d => (new Date(y, mo, d).getDay() + 6) % 7;
  const t = R(0, 3);
  if (t === 0) {
    const d = R(1, dim), x = wd(d);
    return choice(`Op welke dag valt <b>${d} ${MAANDEN[mo]}</b>?`, DAGEN[x], [1, 6, 2, 5].map(k => DAGEN[(x + k) % 7]),
      'Zoek de datum in de kalender. Kijk dan welke dag er bovenaan die kolom staat.', { vis: mt_cal(y, mo, [d]) });

}
function mt_kalBegrip() {

    ['Hoeveel maanden zijn een half jaar?', 6, 'Een jaar heeft 12 maanden.'], ['Hoeveel weken heeft een jaar ongeveer?', 52, '365 dagen gedeeld door 7.']]);

/* ===================== MEETKUNDE: BLOKKENBOUWSELS ===================== */
/* h[r][c]: r = 0 achterste rij … laatste rij = voorkant; c = 0 links. Hoogtes worden nooit hoger naar voren of naar rechts,
   zodat elke stapel van bovenaf zichtbaar blijft. */
function mt_bouw(big) {
  const sizes = big ? [[3, 3], [3, 4], [4, 3], [4, 4], [3, 3]] : [[2, 2], [2, 3], [3, 2], [3, 3], [2, 3]];
  const maxH = big ? 4 : 3, lo = big ? 11 : 3, hi = big ? 25 : 10;
  for (let k = 0; k < 300; k++) {
    const [RR, C] = pick(sizes), h = [];
    let tot = 0;
    for (let r = 0; r < RR; r++) {
      h.push([]);
      for (let c = 0; c < C; c++) {
        const cap = Math.min(r ? h[r - 1][c] : maxH, c ? h[r][c - 1] : maxH);
        const v = r === 0 && c === 0 ? R(2, maxH) : Math.random() < 0.5 ? R(Math.max(0, cap - 1), cap) : R(0, cap);
        h[r].push(v); tot += v;
      }
    }
    if (tot >= lo && tot <= hi && h[RR - 1][0] > 0 && h[0][C - 1] > 0) return h;
  }
  return big ? [[4, 3, 2], [3, 2, 1], [2, 1, 1]] : [[2, 1], [1, 1]];
}
const mt_som = h => h.flat().reduce((a, b) => a + b, 0);
function mt_blokken(h, labels) {
  const RR = h.length, C = h[0].length, s = 26, dx = 12, dy = 12, maxH = Math.max(...h.flat());
  const x0 = 24, y0 = 18 + maxH * s + RR * dy;
  const W = x0 + C * s + RR * dx + (labels ? 54 : 18), Hh = y0 + (labels ? 22 : 8);
  const pt = a => a.map(([x, y]) => `${round(x, 1)},${round(y, 1)}`).join(' ');
  let g = '';
  for (let r = 0; r < RR; r++) for (let c = 0; c < C; c++) { // vloer
    const d = RR - 1 - r, X = x0 + c * s + d * dx, Y = y0 - d * dy;
    g += `<polygon points="${pt([[X, Y], [X + s, Y], [X + s + dx, Y - dy], [X + dx, Y - dy]])}" class="mt-floor"/>`;
  }
  for (let r = 0; r < RR; r++) for (let c = 0; c < C; c++) for (let z = 0; z < h[r][c]; z++) {
    const d = RR - 1 - r, X = x0 + c * s + d * dx, Y = y0 - d * dy - z * s;
    g += `<polygon points="${pt([[X, Y - s], [X + s, Y - s], [X + s + dx, Y - s - dy], [X + dx, Y - s - dy]])}" class="mt-ct"/>`;
    g += `<polygon points="${pt([[X + s, Y], [X + s + dx, Y - dy], [X + s + dx, Y - s - dy], [X + s, Y - s]])}" class="mt-cr"/>`;
    g += `<rect x="${X}" y="${Y - s}" width="${s}" height="${s}" class="mt-cf"/>`;
  }
  if (labels) {
    g += `<text x="${x0 + C * s / 2}" y="${y0 + 17}" text-anchor="middle" class="mt-lbl">voor</text>`;
    g += `<text x="${x0 + C * s + RR * dx / 2 + 8}" y="${round(y0 - RR * dy / 2 + 2, 1)}" text-anchor="start" class="mt-lbl">rechts</text>`;
  }
  return `<svg class="mt-svg mt-blok" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="blokkenbouwsel">${g}</svg>`;
}
function mt_plat(h) {
  const RR = h.length, C = h[0].length, s = 22;
  let g = '';
  h.forEach((row, r) => row.forEach((v, c) => {
    g += `<rect x="${2 + c * s}" y="${2 + r * s}" width="${s}" height="${s}" class="${v ? 'mt-pc' : 'mt-pe'}"/>`;
    if (v) g += `<text x="${2 + c * s + s / 2}" y="${2 + r * s + s / 2 + 5}" text-anchor="middle" class="mt-pn">${v}</text>`;
  }));
  g += `<text x="${2 + C * s / 2}" y="${RR * s + 16}" text-anchor="middle" class="mt-pv">voor</text>`;
  return `<svg class="mt-plat" viewBox="0 0 ${C * s + 4} ${RR * s + 20}" role="img" aria-label="plattegrond">${g}</svg>`;
}
function mt_view(cols) {
  const s = 18, H = 4;
  let g = '';
  cols.forEach((v, i) => { for (let z = 0; z < v; z++) g += `<rect x="${2 + i * s}" y="${2 + (H - 1 - z) * s}" width="${s}" height="${s}" class="mt-vc"/>`; });
  g += `<line x1="0" y1="${2 + H * s}" x2="${cols.length * s + 4}" y2="${2 + H * s}" class="mt-vg"/>`;
  return `<svg class="mt-view" viewBox="0 0 ${cols.length * s + 4} ${H * s + 4}" role="img" aria-label="aanzicht">${g}</svg>`;
}
function mt_blokTel(big) {
  const h = mt_bouw(big);
  return num('Hoeveel blokken zijn er gebruikt voor dit bouwsel?', mt_som(h), 'Tel per stapel hoeveel blokken er op elkaar staan. Vergeet de blokken niet die achter of onder andere blokken verstopt zitten.', { vis: mt_blokken(h, false) });
}
function mt_blokPlat(big) {
  const h = mt_bouw(big), RR = h.length, C = h[0].length, w = [];
  w.push(h.map(r => r.slice().reverse()), h.slice().reverse());
  if (RR === C) w.push(h.map((r, i) => r.map((_, j) => h[j][i])));
  for (let k = 0; k < 6; k++) {
    const c = h.map(r => r.slice()), i = R(0, RR - 1), j = R(0, C - 1);
    c[i][j] = c[i][j] === 0 ? 1 : c[i][j] + pick([1, -1]);
    w.push(c);
  }
  return choice('Welke plattegrond hoort bij dit bouwsel? Het getal zegt hoeveel blokken er op dat vakje staan.', mt_plat(h), shuffle(w).map(mt_plat),
    'Kijk eerst naar de voorste rij en de linker rij. Klopt de hoogte van elke stapel? Klopt de plek van de lege vakjes?', { vis: mt_blokken(h, true) });
}
function mt_blokAanzicht(big) {
  const h = mt_bouw(big), RR = h.length, C = h[0].length;
  const front = [...Array(C).keys()].map(c => Math.max(...h.map(r => r[c])));
  const right = [...Array(RR).keys()].map(r => Math.max(...h[RR - 1 - r]));
  const voor = Math.random() < 0.5, ans = voor ? front : right, other = voor ? right : front;
  const w = [other, ans.slice().reverse(), other.slice().reverse(), voor ? h[RR - 1].slice() : h.map(r => r[C - 1]).reverse()];
  for (let k = 0; k < 4; k++) { const c = ans.slice(), i = R(0, c.length - 1); c[i] = c[i] >= 4 ? 3 : c[i] <= 1 ? c[i] + 1 : c[i] + pick([1, -1]); w.push(c); }
  return choice(voor ? 'Je kijkt recht van <b>voren</b> naar het bouwsel. Wat zie je?' : 'Je kijkt recht van <b>rechts</b> naar het bouwsel. Wat zie je?',
    mt_view(ans), w.map(mt_view),
    voor ? 'Van voren zie je per kolom (van links naar rechts) alleen de hoogste stapel. Lagere stapels erachter zie je niet.'
      : 'Van rechts zie je de voorkant links en de achterkant rechts. Per rij zie je alleen de hoogste stapel.', { vis: mt_blokken(h, true) });
}

  <script>
'use strict';
/* Rekenraket – domein Verhoudingen: verhoudingstabellen, breuken, procenten, relatie, schaal.
   Alle globale namen beginnen met vh_. */

/* ===================== hulpfuncties ===================== */
const vh_lcm = (a, b) => a / gcd(a, b) * b;
/* breuk als tekst (wordt in q/keuzes automatisch gestapeld). Gemengd: "1 1/4" */
function vh_mx(w, n, d) {
  if (!n) return String(w);
  return w ? `${w} ${n}/${d}` : `${n}/${d}`;
}
/* Antwoordtekst: vereenvoudigd, en bij meer dan 1 ook als gemengd getal */
function vh_ans(n, d) {
  const g = gcd(n, d); n /= g; d /= g;
  if (d === 1) return String(n);
  if (n < d) return `${n}/${d}`;
  return `${n}/${d} = ${vh_mx(Math.floor(n / d), n % d, d)}`;
}
/* num-vraag met een breuk als antwoord */
function vh_fnum(q, n, d, hint, o = {}) {
  return num(q, n / d, hint, Object.assign({ frac: true, a: vh_ans(n, d) }, o));
}
/* gestapelde breuk met invulvakjes */
const vh_fin = (a, b) => `<span class="frac vh-fin"><span>${a}</span><span>${b}</span></span>`;
/* bedrag: heel getal zonder komma, anders 2 decimalen */

const vh_eur = v => '€ ' + vh_geld(v);
function vh_money(q, v, hint, o = {}) {
  return num(q, round(v, 2), hint, Object.assign({ unit: '€', pre: true, a: vh_eur(v) }, o));
}
function vh_pickN(arr, n) { return shuffle(arr).slice(0, n); }
/* teller 1..d-1 die niet te vereenvoudigen is */
function vh_cop(d) { const c = []; for (let n = 1; n < d; n++) if (gcd(n, d) === 1) c.push(n); return pick(c); }

/* ===================== verhoudingstabel ===================== */
/* top/bot: waarden; bt/bb: true = invulvakje. Nummering per rij van links naar rechts. */
function vh_tabel(h1, h2, top, bot, bt, bb) {
  let i = 0;
  const blanks = [];
  const cell = (v, b, geld) => {
    if (b) { blanks.push(v); return `<td class="vh-blank">{{${i++}}}</td>`; }
    return `<td>${geld ? vh_geld(v) : nl(v, v >= 10000)}</td>`;
  };
  let html = `<table class="vh-tab"><tr><th>${h1}</th>${top.map((v, k) => cell(v, bt[k], h1.includes('€'))).join('')}</tr>`;
  html += `<tr><th>${h2}</th>${bot.map((v, k) => cell(v, bb[k], h2.includes('€'))).join('')}</tr></table>`;
  return { html: `<div class="vh-tabwrap">${html}</div>`, blanks };
}
/* contexten: r = onderste waarde bij 1 bovenste; ri = hele getallen, rd = kommagetallen; dt = boven mag ,5 zijn */
const VH_CTX = [
  { h1: 'pakken koek', h2: 'prijs (€)', ri: [2, 3, 4, 5, 6], rd: [0.8, 1.2, 1.25, 1.5, 2.5, 0.75], dt: false, s: (t, b) => `${nl(t)} pakken koek kosten € ${vh_geld(b)}.` },

  { h1: 'meter stof', h2: 'prijs (€)', ri: [4, 5, 6, 8], rd: [4.5, 3.25, 6.5, 2.8, 5.5], dt: true, s: (t, b) => `${nl(t)} meter stof kost € ${vh_geld(b)}.` }

/* Kies context, verhouding en 4 kolommen (eerste kolom = startkolom) */
function vh_vtSetup(dec) {
  const ctx = pick(VH_CTX.filter(c => (dec ? c.rd.length : c.ri.length)));
  const r = dec ? pick(ctx.rd) : pick(ctx.ri);
  const twoDec = Math.round(r * 100) % 10 !== 0;
  const halves = dec && ctx.dt && !twoDec;
  const t0 = halves && Math.random() < 0.4 ? pick([1.5, 2.5]) : pick([2, 3, 4, 5, 6]);
  let cand = [1, t0 * 2, t0 * 3, t0 * 4, t0 * 5, t0 * 10, t0 / 2, t0 + 1, t0 * 2 + 1];
  if (halves) cand = cand.concat([0.5, t0 * 1.5, 2.5, 3.5, 4.5]);
  cand = [...new Set(cand.map(x => round(x, 3)))].filter(x => x > 0 && x !== t0 && x <= 100 && (halves ? Number.isInteger(x * 2) : Number.isInteger(x)));
  if (!dec) cand = cand.filter(x => x * r <= 2000);
  const others = vh_pickN(cand, 3).sort((a, b) => a - b);
  const top = [t0, ...others], bot = top.map(t => round(t * r, 3));
  return { ctx, r, top, bot };
}
function vh_vtHint(s) {
  return `Kijk in de eerste kolom: bij ${nl(s.top[0])} hoort ${nl(s.bot[0])}. Wat hoort er bij 1? Of: met welk getal doe je de bovenste rij keer? Doe met de onderste rij hetzelfde.`;
}
function vh_vtOnder(dec) {
  const s = vh_vtSetup(dec);
  const t = vh_tabel(s.ctx.h1, s.ctx.h2, s.top, s.bot, [0, 0, 0, 0], [0, 1, 1, 1]);
  return multi(`${s.ctx.s(s.top[0], s.bot[0])} Vul de onderste rij in.`, t.blanks, vh_vtHint(s), { vis: t.html });
}
function vh_vtBeide(dec) {
  const s = vh_vtSetup(dec);
  let bt, bb;
  do {
    bt = [0]; bb = [0];
    for (let k = 1; k < 4; k++) { const up = Math.random() < 0.5; bt.push(up ? 1 : 0); bb.push(up ? 0 : 1); }
  } while (!bt.some(x => x) || !bb.some(x => x));
  const t = vh_tabel(s.ctx.h1, s.ctx.h2, s.top, s.bot, bt, bb);
  return multi(`${s.ctx.s(s.top[0], s.bot[0])} Vul de tabel verder in.`, t.blanks, vh_vtHint(s) + ' Een bovenste vakje leeg? Reken dan terug: delen in plaats van keer.', { vis: t.html });
}
function vh_vtHeel(dec) {
  const s = vh_vtSetup(dec);
  /* startkolom alleen in het verhaal; in de tabel van elke kolom één getal */
  let top = s.top.slice(1), bot = s.bot.slice(1);
  const extra = round(s.top[0] * pick([2, 3]), 3);
  if (!top.includes(extra) && extra <= 100) { top.push(extra); bot.push(round(extra * s.r, 3)); }
  else { top.unshift(1); bot.unshift(round(s.r, 3)); }
  if (top.filter(x => x === 1).length > 1) { top = s.top.slice(1); bot = s.bot.slice(1); }
  const idx = top.map((_, i) => i).sort((a, b) => top[a] - top[b]);
  top = idx.map(i => top[i]); bot = idx.map(i => bot[i]);
  let bt;
  do { bt = top.map(() => (Math.random() < 0.5 ? 1 : 0)); } while (!bt.some(x => x) || bt.every(x => x));
  const bb = bt.map(x => 1 - x);
  const t = vh_tabel(s.ctx.h1, s.ctx.h2, top, bot, bt, bb);
  return multi(`${s.ctx.s(s.top[0], s.bot[0])} Vul de hele tabel in.`, t.blanks,
    `Zet eerst ${nl(s.top[0])} en ${nl(s.bot[0])} in je hoofd (of op een kladblaadje) als startkolom. Reken dan uit wat er bij 1 hoort, of zoek een handige keersom.`, { vis: t.html });
}

function vh_colsFor(cells) {

}

function vh_lijn() {

function vh_orde() {

/* breuk-operand: {w, n, d}; totale teller = w*d+n */
const vh_tn = o => o.w * o.d + o.n;

function vh_plusmin(pairs, mixedKans) {
  const [d1, d2] = shuffle(pick(pairs));
  const mk = d => ({ w: Math.random() < mixedKans ? R(1, 3) : 0, n: vh_cop(d), d });
  let a = mk(d1), b = mk(d2);
  const L = vh_lcm(d1, d2);
  let A = vh_tn(a) * L / d1, B = vh_tn(b) * L / d2;
  const plus = Math.random() < 0.5;
  if (!plus) {
    if (A === B) return vh_plusmin(pairs, mixedKans);
    if (A < B) { [a, b] = [b, a]; [A, B] = [B, A]; }
  }
  const res = plus ? A + B : A - B;
  const q = `${vh_op(a)} ${plus ? '+' : '−'} ${vh_op(b)} = ?`;
  const hint = d1 === d2 ? `De noemers zijn gelijk. ${plus ? 'Tel de tellers op' : 'Haal de tellers van elkaar af'}; de noemer blijft ${d1}.${a.w || b.w ? ' Reken eerst met de hele getallen.' : ''}`
    : `Maak de noemers eerst gelijk. Zoek een getal waar ${d1} en ${d2} allebei in passen, bijvoorbeeld ${L}.`;

}

function vh_heelxbreuk() {

function vh_pHint(p) {

const VH_AANTAL = [['kinderen op school', 'gaan', 'gaat', 'op de fiets'], ['bezoekers in de dierentuin', 'zijn', 'is', 'een kind'], ['leerlingen', 'hebben', 'heeft', 'een broertje of zusje'], ['mensen in de bioscoop', 'eten', 'eet', 'popcorn'], ['bloembollen', 'komen', 'komt', 'uit'], ['fans in het stadion', 'dragen', 'draagt', 'een sjaal']];
function vh_pBase(lv, p, lo, hi) {

const VH_SPUL = [['fiets', 180, 600], ['jas', 40, 160], ['spelcomputer', 200, 500], ['skateboard', 40, 120], ['koptelefoon', 40, 200], ['tent', 80, 300], ['paar schoenen', 40, 140], ['tablet', 150, 500]];
function vh_prijsSetup(lv) {

/* ===================== relatie breuk – komma – procent – verhouding ===================== */
const VH_RB = [[1, 2], [1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5], [1, 10], [3, 10], [7, 10], [9, 10], [1, 20], [1, 1]];
const VH_RL = [[1, 8], [3, 8], [5, 8], [7, 8], [3, 20], [7, 20], [9, 20], [1, 25], [4, 25], [12, 25], [1, 50], [9, 50], [3, 100], [17, 100], [5, 4], [3, 2], [6, 5], [11, 20], [3, 40]];
const vh_rset = lv => (lv === 1 ? VH_RB.slice(0, 12) : VH_RL);
function vh_relBK(lv) {
  const [n, d] = pick(vh_rset(lv)), v = n / d;
  if (Math.random() < 0.5) return num(`${n}/${d} = ? (kommagetal)`, round(v, 3), `Deel de teller door de noemer: ${n} : ${d}. Of maak eerst de noemer 10, 100 of 1000.`);

function vh_relBP(lv) {

  if (Math.random() < 0.5) return num(`${n}/${d} = ?%`, p, `Maak de noemer 100. ${100 % d === 0 ? `Doe teller en noemer keer ${100 / d}.` : 'Of reken eerst het kommagetal uit.'}`, { unit: '%' });
  return vh_fnum(`${nl(p)}% = ? (breuk)`, n, d, Number.isInteger(p) ? `${p}% = ${p}/100. Vereenvoudig deze breuk.` : `${nl(p)}% = ${round(p * 10)} van de 1000. Maak daar een breuk van en vereenvoudig.`);

function vh_relKP(lv) {

}
function vh_relMix(lv) {
  const [n, d] = pick(lv === 1 ? [[1, 2], [1, 4], [3, 4], [1, 5], [2, 5], [1, 10], [3, 10]] : [[1, 8], [3, 8], [3, 20], [1, 25], [7, 20], [2, 5], [3, 4], [1, 20]]);
  const p = round(n / d * 100, 3), k = round(n / d, 3);
  const t = R(0, 4);
  const wrongs = (good) => {
    const opts = [`${nl(p)}%`, nl(k), `${n}/${d}`, `${n} op de ${d}`];
    const fake = [[`${nl(round(d / n, 3))}%`, d / n / 100], [`${nl(n * 10 + d)}%`, (n * 10 + d) / 100], [nl(round(n / 10 + d / 100, 3)), n / 10 + d / 100], [`${d}/${n + d}`, d / (n + d)],
      [`${nl(n * d)}%`, n * d / 100], [`${n}/${d + n}`, n / (d + n)], [nl(round(n / d / 10, 4)), n / d / 10], [`${nl(round(p / 10, 3))}%`, p / 1000]]
      .filter(f => Math.abs(f[1] - n / d) > 1e-9 && !/,\d{3}/.test(f[0]) && f[1] < 1.5).map(f => f[0]);
    return { opts: opts.filter(x => x !== good), fake };
  };
  if (t === 0) {
    /* x op de y → procent */
    const [wat, zin] = pick([['kinderen', 'heeft een hond'], ['mensen', 'draagt een bril'], ['auto’s', 'is rood']]);
    return num(`${n} op de ${d} ${wat} ${zin}. Hoeveel procent is dat?`, p, `${n} op de ${d} is de breuk ${n}/${d}. Maak er "van de 100" van.`, { unit: '%' });
  }
  if (t === 1) {
    /* verhouding a : b → deel van het geheel */
    const a = n, b = d - n;
    const v = pick([['saft', 'water', 'limonade'], ['rode', 'blauwe', 'knikkers'], ['jongens', 'meisjes', 'klas']]);
    if (Math.random() < 0.5) return vh_fnum(`De verhouding ${v[0]} : ${v[1]} is ${a} : ${b}. Welk deel van de ${v[2]} is ${v[0]}?`, a, a + b,

    return num(`De verhouding ${v[0]} : ${v[1]} is ${a} : ${b}. Hoeveel procent van de ${v[2]} is ${v[0]}?`, p, `Tel eerst alle delen op: ${a} + ${b}. Maak dan een breuk en reken die om naar procenten.`, { unit: '%' });
  }
  if (t === 2) {
    const show = pick([`${n}/${d}`, `${nl(p)}%`, nl(k)]);
    const good = pick([`${n}/${d}`, `${nl(p)}%`, nl(k), `${n} op de ${d}`].filter(x => x !== show));
    const w = wrongs(good);
    return choice(`Wat is evenveel als ${show}?`, good, w.fake, 'Reken alles om naar procenten. Dan kun je ze makkelijk vergelijken.');
  }
  if (t === 3) return num(`${n} op de ${d} = ? (kommagetal)`, k, `${n} op de ${d} = ${n}/${d}. Reken die breuk om naar een kommagetal.`);
  /* welke hoort er niet bij */

  const odd = pick(wrongs('').fake.filter(x => !set.includes(x)));
  const shown = vh_pickN(set, 3);
  return choice(`Drie hiervan zijn even groot. Welke hoort er <b>niet</b> bij?`, odd, shown, 'Reken alles om naar procenten en vergelijk.');
}

      'Zoek eerst welke bus je haalt. Kijk dan hoe laat die bus bij de andere halte is.', { vis: D.vis, unit: 'min' });
  }
  const steden = vb_pickN(['Amsterdam', 'Rotterdam', 'Eindhoven', 'Groningen', 'Arnhem'], 3);
  const ms = VB_MND.slice(0, 4);
  const Tm = steden.map(() => ms.map(() => R(30, 120)));
  const vis = vb_tbl([['regen (mm)', ...ms.map(m => m[0])], ...steden.map((s, k) => [s, ...Tm[k].map(String)])]);
  const s = R(0, 2), [a, b] = vb_pickN([0, 1, 2, 3], 2).sort((x, y) => x - y);
  const r = R(0, 1);
  if (r === 0) {
    const tot = vb_sum(Tm[s]);
    const g = tot / 4;
    return num(`<b>Neerslag per maand</b><br>Hoeveel regen viel er gemiddeld per maand in ${steden[s]}?`, round(g, 3), 'Tel de vier maanden op en deel door 4.', { vis, unit: 'mm' });
  }
  const s2 = (s + 1) % 3;
  const v1 = Tm[s][a] + Tm[s][b], v2 = Tm[s2][a] + Tm[s2][b];
  return num(`<b>Neerslag per maand</b><br>Hoeveel mm regen viel er in ${ms[a][1]} en ${ms[b][1]} samen in ${steden[s]} en ${steden[s2]} samen?`, v1 + v2,
    'Zoek de vier getallen op (twee steden, twee maanden) en tel ze op.', { vis, unit: 'mm' });
}

  <script>
'use strict';
/* Rekenraket – spelletjes. Elk spel: start(el, ctx) → geeft een opruimfunctie terug.
   ctx = { groep, beep(type), finish(gameKey, score, {lower, label}) → html, confetti() } */

function gameIntro(el, g, extra, onStart) {
  el.innerHTML = `<div class="card game-intro">
    <div class="emoji huge">${g.emoji}</div><h1>${g.title}</h1><p>${g.how}</p>${extra || ''}
    ${extra ? '' : '<button class="btn big primary" data-start>Start!</button>'}</div>`;
  el.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => onStart(b.dataset.start)));
}
function gameOver(el, ctx, key, score, opts, restart) {
  const res = ctx.finish(key, score, opts || {});
  el.innerHTML = `<div class="card game-intro">
    <div class="emoji huge">${res.newHigh ? '🏆' : '🎉'}</div>
    <h1>${res.newHigh ? 'Nieuw record!' : 'Goed gedaan!'}</h1>
    <p class="bigscore">${score} <small>${(opts && opts.label) || 'punten'}</small></p>
    <p>Record: <b>${res.high}</b> · Verdiende sterren: <b>⭐ ${res.stars}</b></p>
    <div class="row"><button class="btn big primary" data-again>Nog een keer</button><a class="btn big" href="#/spellen">Andere spelletjes</a></div></div>`;
  el.querySelector('[data-again]').addEventListener('click', restart);
}
function hud(items) {
  return `<div class="hud">${items.map(([k, v]) => `<div><small>${k}</small><b data-hud="${k}">${v}</b></div>`).join('')}</div>`;
}
const setHud = (el, k, v) => { const n = el.querySelector(`[data-hud="${k}"]`); if (n) n.textContent = v; };

/* Snelle sommen voor spelletjes, aangepast aan de groep */
function quickQ(g) {
  const k = R(0, 9);
  if (g <= 2) { if (k < 6) { const a = R(0, 5), b = R(1, 10 - a > 5 ? 5 : 10 - a); return { q: `${a} + ${b}`, v: a + b }; } const a = R(3, 10), b = R(1, a); return { q: `${a} − ${b}`, v: a - b }; }
  if (g <= 3) { if (k < 5) { const a = R(1, 10), b = R(1, 10); return { q: `${a} + ${b}`, v: a + b }; } const a = R(5, 20), b = R(1, a); return { q: `${a} − ${b}`, v: a - b }; }
  if (g === 4) {
    if (k < 4) { const t = pick([1, 2, 3, 4, 5, 10]), b = R(1, 10); return { q: `${b} × ${t}`, v: b * t }; }
    if (k < 7) { const a = R(10, 80), b = R(1, 99 - a); return { q: `${a} + ${b}`, v: a + b }; }
    const a = R(20, 100), b = R(1, a); return { q: `${a} − ${b}`, v: a - b };
  }
  if (g <= 6) {
    if (k < 5) { const t = R(2, 10), b = R(1, 10); return { q: `${b} × ${t}`, v: b * t }; }
    if (k < 8) { const b = R(2, 10), c = R(1, 10); return { q: `${b * c} : ${b}`, v: c }; }
    const a = R(100, 900), b = R(1, 9) * 10; return { q: `${a} + ${b}`, v: a + b };
  }
  if (k < 3) { const t = R(3, 12), b = R(3, 12); return { q: `${b} × ${t}`, v: b * t }; }
  if (k < 5) { const b = R(3, 12), c = R(2, 12); return { q: `${b * c} : ${b}`, v: c }; }
  if (k < 7) { const p = pick([10, 25, 50]), base = (p === 25 ? 4 : p === 50 ? 2 : 10) * R(2, 15); return { q: `${p}% van ${base}`, v: p * base / 100 }; }
  if (k < 8) { const a = R(2, 12); return { q: `${a}²`, v: a * a }; }
  const a = R(2, 9), b = R(2, 9), c = R(1, 20); return { q: `${c} + ${a} × ${b}`, v: c + a * b };
}

const GAMES = {
  /* ---------- TAFELRACE ---------- */
  tafelrace: {
    title: 'Tafelrace', desc: 'Hoeveel keersommen kun jij in 60 seconden?', emoji: '🏎️', color: '#FF5A5F',

    start(el, ctx) {

        const next = () => {
          const a = t === 'mix' ? R(2, 10) : +t, b = R(1, 10), v = a * b;
          el.querySelector('[data-q]').textContent = `${b} × ${a}`;
          const opts = shuffle([v, ...shuffle([...new Set([v + a, v - a, v + 1, v - 1, (b + 1) * (a + 1), v + 10].filter(x => x >= 0 && x !== v))]).slice(0, 3)]);
          const c = el.querySelector('[data-c]');
          c.innerHTML = opts.map(o => `<button class="btn choice" data-v="${o}">${o}</button>`).join('');
          c.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
            if (busy) return; busy = true;

        next();
        timer = setInterval(() => {

          if (left <= 0 && !stopped) { clearInterval(timer); gameOver(el, ctx, 'tafelrace-' + t, score, { label: 'goed' }, intro); if (score >= 20) ctx.confetti(); }

  ballonnen: {

    how: 'Knal de ballon met het goede antwoord! Pas op: laat het goede antwoord niet wegvliegen. Je hebt 3 levens.',
    start(el, ctx) {
      let raf = null, alive = false;
      const play = () => {
        let score = 0, lives = 3, cur = quickQ(ctx.groep), qid = 0, balloons = [], last = performance.now(), spawnIn = 0, sinceCorrect = 0;
        el.innerHTML = `${hud([['Punten', 0], ['Levens', '❤️❤️❤️']])}<div class="card qcard small"><div class="q" data-q>${cur.q} = ?</div></div><div class="sky" data-sky></div>`;
        const sky = el.querySelector('[data-sky]');
        const H = () => sky.clientHeight;
        const colors = ['#FF5A5F', '#FFB800', '#2BB673', '#2D9CDB', '#6C4CF1', '#E94C89', '#FF8A3D'];
        const lose = () => {
          lives--; setHud(el, 'Levens', '❤️'.repeat(Math.max(lives, 0)) || '💔'); ctx.beep('bad');
          sky.classList.add('shake'); setTimeout(() => sky.classList.remove('shake'), 400);
          if (lives <= 0) { alive = false; cancelAnimationFrame(raf); setTimeout(() => gameOver(el, ctx, 'ballonnen-' + ctx.groep, score, {}, play), 500); }
        };
        const spawn = () => {
          const onScreen = balloons.some(b => b.v === cur.v && b.y > H() * 0.35);
          const correct = !onScreen && (sinceCorrect >= 2 || Math.random() < 0.4);
          let v = cur.v;
          if (!correct) { v = pick(nearWrongs(cur.v, 5)); } else sinceCorrect = -1;
          sinceCorrect++;
          const node = document.createElement('button');
          node.className = 'balloon';
          node.style.setProperty('--c', pick(colors));
          node.style.left = R(2, 78) + '%';
          node.textContent = v;
          const b = { v, y: H() + 10, node, popped: false, qid: correct ? qid : -1 };
          node.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (!alive || b.popped) return;

        };
        const loop = now => {
          if (!alive) return;

          for (const b of balloons.slice()) {
            b.y -= speed * dt;
            b.node.style.transform = `translateY(${b.y}px)`;
            if (b.y < -90) {
              b.node.remove(); balloons = balloons.filter(x => x !== b);
              if (b.qid === qid && !b.popped) lose();
            }
          }
          raf = requestAnimationFrame(loop);
        };
        alive = true; raf = requestAnimationFrame(loop);
      };
      gameIntro(el, this, '', play);
      return () => { alive = false; cancelAnimationFrame(raf); };
    }
  },

  /* ---------- MEMORY ---------- */
  memory: {
    title: 'Sommen-memory', desc: 'Zoek de som en het antwoord die bij elkaar horen.', emoji: '🃏', color: '#2BB673',
    how: 'Zoek steeds de som en het antwoord dat erbij hoort. Lukt het met zo min mogelijk beurten?',
    start(el, ctx) {

        el.innerHTML = `${hud([['Beurten', 0], ['Tijd', '0:00']])}<div class="memory">${cards.map((c, k) => `<button class="mcard ${c.kind}" data-k="${k}" aria-label="kaart"><span class="back">?</span><span class="front">${c.t}</span></button>`).join('')}</div>`;

        el.querySelectorAll('.mcard').forEach(btn => btn.addEventListener('click', () => {

  vergelijk: {

  /* ---------- GETALLENLIJN ---------- */
  getallenlijn: {

          ctx.beep(pts >= 60 ? 'good' : 'bad');

      return () => clearTimeout(to);
    }
  }
};

'use strict';
/* Rekenraket – app: routes, schermen, de sommen-speler en voortgang */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AVATARS = ['🦊', '🐼', '🦁', '🐸', '🐙', '🦄', '🐯', '🐵', '🐧', '🐢', '🚀', '🤖'];
const fr = (s, q) => (q && q.noFrac ? s : fracHTML(s));

/* ---------- opslag ---------- */
const KEY = 'rekenraket-v2';
const fresh = () => ({ profile: null, filter: null, stars: 0, ex: {}, tests: {}, timed: {}, games: {}, sound: true, streak: 0, lastDay: null, history: [], counts: { practice: 0, tests: 0, perfect: 0, games: 0, timed: 0 } });
let S = (() => {
  try {
    const s = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {});
    s.counts = Object.assign(fresh().counts, s.counts);
    return s;
  } catch (e) { return fresh(); }
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* privé-modus */ } }
const today = (d = new Date()) => d.toLocaleDateString('sv');
function touchDay() {
  const t = today();
  if (S.lastDay === t) return;
  S.streak = S.lastDay === today(new Date(Date.now() - 864e5)) ? S.streak + 1 : 1;
  S.lastDay = t; save();
}
function addStars(n) { if (n > 0) { S.stars += n; save(); updateTop(); } }
function record(id, ok) {
  const r = S.ex[id] = S.ex[id] || { n: 0, ok: 0, last: [] };

/* beheersing: 0 = nog niet, 1 = bezig, 2 = beheerst (laatste 8+ pogingen ≥ 80% goed) */
function mastery(id) {
  const r = S.ex[id];
  if (!r || !r.n) return 0;
  const l = r.last || [];

}

/* ---------- geluid & confetti ---------- */
let actx;
function beep(type) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { good: [660, 990], bad: [260, 200], win: [523, 659, 784, 1046], tap: [500] }[type] || [440];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
      o.type = type === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.22);
    });
  } catch (e) { /* geen audio */ }
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'), x = c.getContext('2d');
  c.className = 'confetti'; document.body.appendChild(c);
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#FF5A5F', '#FFB800', '#2BB673', '#2D9CDB', '#6C4CF1', '#E94C89'];
  const P = Array.from({ length: 140 }, () => ({ x: W / 2, y: H / 3, vx: (Math.random() - 0.5) * 14, vy: Math.random() * -14 - 4, s: Math.random() * 8 + 4, c: pick(cols), r: Math.random() * 6 }));
  let f = 0;
  (function draw() {
    x.clearRect(0, 0, W, H);
    for (const p of P) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (++f < 150) requestAnimationFrame(draw); else c.remove();
  })();
}

  const intro = () => {
    app.innerHTML = `<div class="card result"><div class="emoji huge">${{ oefen: '✏️', toets: '📝', tijd: '⏱' }[mode]}</div>

  };
  const finish = (r, secs) => {
    const key = title;

/* ===================== de sommen-speler ===================== */
function parseAnswer(s) {
  s = String(s).trim().replace(/[€%]/g, '').replace(/\s+/g, ' ').replace(/,/g, '.').trim();
  let m;
  if ((m = s.match(/^(\d+) (\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/))) return +m[2] === 0 ? NaN : m[1] / m[2];
  if (/^\d*\.?\d+$|^\d+\.$/.test(s)) return parseFloat(s);
  return NaN;
}
const same = (a, b) => Math.abs(a - b) < 1e-6;

/* Numpad (voor num en multi). onKey(k) krijgt '0'-'9', ',', '/', ' ', '⌫', 'ok' */
function padHTML(frac, mixed) {
  const keys = ['1', '2', '3', '⌫', '4', '5', '6', ',', '7', '8', '9', frac ? '/' : '', '0'];
  return `<div class="pad">${keys.map(k => k ? `<button type="button" class="key ${k === '⌫' ? 'del' : ''}" data-k="${k}" aria-label="${k === '⌫' ? 'wissen' : k}">${k}</button>` : '<span></span>').join('')}
    <button type="button" class="key ok" data-k="ok">Klaar ✓</button>${frac && mixed ? '<button type="button" class="key sp" data-k=" ">spatie</button>' : ''}</div>`;
}
function typeInto(str, k) {
  if (k === '⌫') return str.slice(0, -1);
  if (str.length >= 12) return str;
  const lastPart = str.split(/[ /]/).pop();
  if (k === ',' && lastPart.includes(',')) return str;
  if (k === '/' && str.includes('/')) return str;
  if (k === ' ' && (str.includes(' ') || !str)) return str;
  return str + k;
}

/* Elke vraagsoort heeft een "widget": mount → { value(), right(v), given(v), reset(), reveal(), key(k) } */
const WIDGETS = {
  num(q, area, api) {
    let input = '';
    area.innerHTML = `<div class="display-wrap">${q.pre && q.unit ? `<span class="unit">${q.unit}</span>` : ''}<div class="display" aria-live="polite"></div>${!q.pre && q.unit ? `<span class="unit">${q.unit}</span>` : ''}</div>${padHTML(q.frac, q.frac)}`;
    const draw = () => { $('.display', area).innerHTML = input ? fracHTML(esc(input)) : '<span class="ph">?</span>'; };
    const key = k => { if (k === 'ok') return input && api.submit(); input = typeInto(input, k); draw(); };
    $$('[data-k]', area).forEach(b => b.addEventListener('click', () => key(b.dataset.k)));
    draw();
    return { value: () => input || null, right: v => same(parseAnswer(v), q.v), given: v => v + (q.unit && !q.pre ? ' ' + q.unit : ''), reset() { input = ''; draw(); }, key };
  },
  multi(q, area, api, qarea) {
    const vals = q.blanks.map(() => '');
    let act = 0;
    $$('.blank', qarea).forEach(b => b.addEventListener('click', () => { act = +b.dataset.b; draw(); }));
    area.innerHTML = padHTML(false);
    const draw = () => $$('.blank', qarea).forEach(b => {
      const i = +b.dataset.b;
      b.innerHTML = vals[i] ? esc(vals[i]) : '&nbsp;';
      b.classList.toggle('act', i === act);
    });
    const key = k => {
      if (k === 'ok') {
        const empty = vals.findIndex(v => !v);
        if (empty < 0) return api.submit();
        if (vals[act]) { act = empty; draw(); }
        return;
      }
      vals[act] = typeInto(vals[act], k); draw();
    };
    $$('[data-k]', area).forEach(b => b.addEventListener('click', () => key(b.dataset.k)));
    draw();
    return {
      value: () => (vals.every(v => v) ? vals.slice() : null),
      right: v => v.every((x, i) => same(parseAnswer(x), q.blanks[i])),
      given: v => v.join(' · '),
      reset() {
        $$('.blank', qarea).forEach(b => {
          const i = +b.dataset.b, ok = same(parseAnswer(vals[i]), q.blanks[i]);
          b.classList.toggle('good', ok);
          if (!ok) vals[i] = '';
        });
        act = Math.max(0, vals.findIndex(v => !v)); draw();
      },
      key
    };
  },
  choice(q, area, api) {
    area.innerHTML = `<div class="choices ${q.choices.length === 4 ? 'four' : ''} ${q.choices.some(c => c.length > 40) ? 'pics' : ''}">${q.choices.map((c, i) => `<button type="button" class="btn choice" data-i="${i}">${fr(c, q)}</button>`).join('')}</div>`;
    const btns = $$('[data-i]', area);
    btns.forEach(b => b.addEventListener('click', () => api.submit(q.choices[+b.dataset.i], b)));
    return {
      choice: true, right: v => v === q.ans, given: v => v,
      key: k => { const b = btns[+k - 1]; if (b && !b.disabled) b.click(); },
      wrong(btn) { btn.classList.add('bad'); btn.disabled = true; },
      reveal() { btns.forEach(b => { if (q.choices[+b.dataset.i] === q.ans) b.classList.add('ok'); }); },
      mark(btn, cls) { if (btn) btn.classList.add(cls); }
    };
  },
  order(q, area, api) {
    let placed = [];   // indices in q.items
    area.innerHTML = `<div class="order-ans" aria-label="Jouw volgorde"></div><div class="order-pool"></div><div class="row"><button type="button" class="btn primary" data-ok>Klaar ✓</button></div>`;
    const draw = () => {
      $('.order-ans', area).innerHTML = placed.length ? placed.map((ix, i) => `<button type="button" class="chip on" data-p="${i}">${fr(q.items[ix], q)}</button>`).join(`<span class="lt">${q.desc ? '&gt;' : '&lt;'}</span>`) : `<span class="ph">Tik de ${q.desc ? 'grootste' : 'kleinste'} eerst</span>`;
      $('.order-pool', area).innerHTML = q.items.map((it, ix) => (placed.includes(ix) ? '' : `<button type="button" class="chip" data-ix="${ix}">${fr(it, q)}</button>`)).join('');
      $$('[data-p]', area).forEach(b => b.addEventListener('click', () => { placed.splice(+b.dataset.p, 1); draw(); }));
      $$('[data-ix]', area).forEach(b => b.addEventListener('click', () => { placed.push(+b.dataset.ix); beep('tap'); draw(); }));
    };
    $('[data-ok]', area).addEventListener('click', () => api.submit());
    draw();
    const strip = h => h.replace(/<span class="frac"><span>(\d+)<\/span><span>(\d+)<\/span><\/span>/g, '$1/$2').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return { value: () => (placed.length === q.items.length ? placed.map(ix => q.items[ix]) : null), right: v => v.every((x, i) => x === q.sorted[i]), given: v => v.map(strip).join(' · '), reset() { placed = []; draw(); }, key: k => k === 'ok' && api.submit() };
  },
  line(q, area, api) {
    let val = null;
    const fmt = q.fmt || (v => nl(v, true));
    area.innerHTML = `<div class="nline q-line"><div class="track"></div>
      ${Array.from({ length: q.ticks + 1 }, (_, i) => { const v = q.min + i * (q.max - q.min) / q.ticks; const lab = q.labels.some(l => same(l, v)); return `<div class="tick ${lab ? 'end' : ''}" style="left:${i / q.ticks * 100}%">${lab ? `<span>${fr(fmt(v), q)}</span>` : ''}</div>`; }).join('')}
      ${q.labels.filter(l => !Array.from({ length: q.ticks + 1 }, (_, i) => q.min + i * (q.max - q.min) / q.ticks).some(v => same(v, l))).map(l => `<div class="tick end" style="left:${(l - q.min) / (q.max - q.min) * 100}%"><span>${fmt(l)}</span></div>`).join('')}
      <div class="marker guess" hidden>▼</div><div class="marker real" hidden>🚩</div></div>
      <p class="small muted center">Tik op de lijn. Je kunt nog verschuiven.</p><div class="row"><button type="button" class="btn primary" data-ok>Klaar ✓</button></div>`;
    const ln = $('.nline', area), mk = $('.guess', ln);
    ln.addEventListener('pointerdown', e => {
      const r = ln.getBoundingClientRect(), p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      val = q.min + p * (q.max - q.min);
      mk.style.left = p * 100 + '%'; mk.hidden = false;
    });
    $('[data-ok]', area).addEventListener('click', () => api.submit());
    return {
      value: () => val, right: v => Math.abs(v - q.v) <= q.tol * (q.max - q.min), given: v => '≈ ' + nl(Math.round(v * 100) / 100, true),
      reset() { val = null; mk.hidden = true; },
      reveal() { const r = $('.real', ln); r.style.left = (q.v - q.min) / (q.max - q.min) * 100 + '%'; r.hidden = false; },
      key: k => k === 'ok' && api.submit()
    };
  },
  clock(q, area, api) {
    const st = q.step;
    let h, m;
    do { h = R(1, 12); m = st >= 60 ? 0 : R(0, 60 / st - 1) * st; } while (h === q.h && m === q.m);
    area.innerHTML = `<div class="clockset"><div class="cs-clock"></div>
      <div class="cs-ctrl"><div><small>Uur</small><button type="button" class="key" data-d="h-">−</button><button type="button" class="key" data-d="h+">+</button></div>
      ${st < 60 ? `<div><small>Minuten (${st})</small><button type="button" class="key" data-d="m-">−</button><button type="button" class="key" data-d="m+">+</button></div>` : ''}</div></div>
      <div class="row"><button type="button" class="btn primary" data-ok>Klaar ✓</button></div>`;
    const draw = () => { $('.cs-clock', area).innerHTML = clockSVG(h, m, 'big'); };
    $$('[data-d]', area).forEach(b => b.addEventListener('click', () => {
      const d = b.dataset.d;
      if (d === 'h+') h = h % 12 + 1; else if (d === 'h-') h = (h + 10) % 12 + 1;
      else { const t = (h % 12) * 60 + m + (d === 'm+' ? st : -st), tt = (t + 720) % 720; h = Math.floor(tt / 60) || 12; m = tt % 60; }
      draw(); beep('tap');
    }));
    $('[data-ok]', area).addEventListener('click', () => api.submit());
    draw();
    return { value: () => ({ h, m }), right: v => v.h % 12 === q.h % 12 && v.m === q.m, given: v => klokWoord(v.h, v.m), reveal() { api.extra(clockSVG(q.h, q.m, 'small')); }, key: k => k === 'ok' && api.submit() };
  },
  count(q, area, api) {
    let n = 0;
    area.innerHTML = `<div class="countbox"><div class="cb-items"></div></div>
      <div class="row"><button type="button" class="btn big" data-c="-">−</button><button type="button" class="btn big" data-c="+">+ ${q.emoji}</button><button type="button" class="btn big primary" data-ok>Klaar ✓</button></div>`;
    const draw = () => { $('.cb-items', area).innerHTML = n ? plaatjes(n, q.emoji) : '<span class="ph">Tik op + om plaatjes neer te zetten</span>'; };
    $$('[data-c]', area).forEach(b => b.addEventListener('click', () => { n = Math.max(0, Math.min(q.max, n + (b.dataset.c === '+' ? 1 : -1))); beep('tap'); draw(); }));
    $('[data-ok]', area).addEventListener('click', () => api.submit());
    draw();
    return { value: () => n, right: v => v === q.n, given: v => String(v), reset() { n = 0; draw(); }, key: k => { if (k === 'ok') api.submit(); } };
  },
  pay(q, area, api) {
    let paid = [];
    area.innerHTML = `<div class="paybox"><small>Jouw geld:</small><div class="pb-tray money"></div></div>
      <div class="money pb-wallet">${q.money.slice().sort((a, b) => a - b).map(c => moneyItem(c, 'button', `type="button" data-c="${c}"`)).join('')}</div>
      <div class="row"><button type="button" class="btn primary" data-ok>Betalen ✓</button></div>`;
    const draw = () => {
      $('.pb-tray', area).innerHTML = paid.length ? paid.map((c, i) => moneyItem(c, 'button', `type="button" data-i="${i}" aria-label="weghalen"`)).join('') : '<span class="ph">Tik op munten en briefjes</span>';
      $$('[data-i]', area).forEach(b => b.addEventListener('click', () => { paid.splice(+b.dataset.i, 1); draw(); }));
    };
    $$('.pb-wallet [data-c]', area).forEach(b => b.addEventListener('click', () => { if (paid.length < 30) { paid.push(+b.dataset.c); paid.sort((a, b2) => b2 - a); beep('tap'); draw(); } }));
    $('[data-ok]', area).addEventListener('click', () => api.submit());
    draw();
    const sum = () => paid.reduce((s, c) => s + c, 0);
    return { value: () => (paid.length ? sum() : null), right: v => v === q.amount, given: v => euro(v / 100), reset() { paid = []; draw(); }, key: k => k === 'ok' && api.submit() };
  },
  colour(q, area, api) {
    const on = new Set();
    area.innerHTML = `<div class="cgrid" style="--cols:${q.cols}">${Array.from({ length: q.cells }, (_, i) => `<button type="button" class="cell" data-i="${i}" aria-label="vakje ${i + 1}"></button>`).join('')}</div>
      <div class="row"><button type="button" class="btn primary" data-ok>Klaar ✓</button></div>`;
    $$('.cell', area).forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; on.has(i) ? on.delete(i) : on.add(i); b.classList.toggle('on'); }));
    $('[data-ok]', area).addEventListener('click', () => api.submit());
    return { value: () => on.size, right: v => v === q.n, given: v => `${v} van de ${q.cells} vakjes`, reset() { on.clear(); $$('.cell', area).forEach(b => b.classList.remove('on')); }, key: k => k === 'ok' && api.submit() };
  }
};

function runSession(el, { title, ids, mode, total, sec, onFinish }) {
  let i = 0, cur, w, tries = 0, locked = false, correct = 0, wrongN = 0, items = [], timeout, timer, bag = [];
  const end = mode === 'tijd' ? Date.now() + sec * 1000 : 0;
  el.innerHTML = `<div class="ex">
    <div class="ex-head"><b class="ex-title">${{ oefen: '✏️ ', toets: '📝 ', tijd: '⏱ ' }[mode]}${esc(title)}</b><span class="count"></span></div>
    <div class="progress" role="progressbar"><div class="bar"></div></div>
    <div class="card qcard"><div class="qarea"></div></div>
    <div class="feedback" aria-live="polite"></div>
    <div class="answer"></div></div>`;
  const qarea = $('.qarea', el), fb = $('.feedback', el), ans = $('.answer', el);
  /* eerlijk verdelen over de gekozen oefeningen */
  const nextId = () => { if (!bag.length) bag = shuffle(ids); return bag.pop(); };
  const api = {
    submit: (val, btn) => submit(val, btn),
    extra: html => { fb.insertAdjacentHTML('beforeend', `<div class="extra">${html}</div>`); }
  };
  function next() {
    if (mode !== 'tijd' && i >= total) return finish();
    let tries2 = 0;
    do { cur = makeQ(nextId()); } while (items.length && cur.q === items[items.length - 1].q && ++tries2 < 5);
    tries = 0; locked = false;
    $('.count', el).textContent = mode === 'tijd' ? `✔ ${correct}` : `${i + 1} / ${total}`;
    if (mode !== 'tijd') $('.bar', el).style.width = (i / total * 100) + '%';
    let qh = fr(cur.q, cur), vis = cur.vis || '';
    const blank = (m, n) => `<button type="button" class="blank" data-b="${n}" aria-label="invulvak ${+n + 1}">&nbsp;</button>`;
    if (cur.type === 'multi') { qh = qh.replace(/\{\{(\d+)\}\}/g, blank); vis = vis.replace(/\{\{(\d+)\}\}/g, blank); }
    qarea.innerHTML = `<div class="q">${qh}</div>${vis ? `<div class="vis">${vis}</div>` : ''}`;
    fb.innerHTML = ''; fb.className = 'feedback';
    w = (WIDGETS[cur.type] || WIDGETS.num)(cur, ans, api, qarea);
  }
  function submit(val, btn) {
    if (locked) return;
    if (val === undefined) val = w.value();
    if (val === null) { fb.className = 'feedback'; fb.textContent = 'Je bent nog niet klaar!'; return; }
    const ok = w.right(val);
    if (mode === 'toets') {
      locked = true;
      record(cur.ex, ok);
      items.push({ q: cur.q, vis: cur.vis, a: cur.a + (cur.type === 'num' && cur.unit && !cur.pre ? ' ' + cur.unit : ''), given: w.given(val), ok, hint: cur.hint, noFrac: cur.noFrac });
      if (ok) correct++;
      if (btn) btn.classList.add('picked');
      beep('tap');
      i++; timeout = setTimeout(next, 250);
      return;
    }
    tries++;
    if (ok) {
      locked = true;
      if (tries === 1) { correct++; record(cur.ex, true); }
      beep('good');
      if (btn) btn.classList.add('ok');
      fb.className = 'feedback ok';
      fb.innerHTML = pick(['Goed zo! 🎉', 'Super! ⭐', 'Knap hoor! 💪', 'Helemaal goed! ✅', 'Top! 🚀']);
      i++; timeout = setTimeout(next, mode === 'tijd' ? 350 : 900);
      return;
    }
    beep('bad');
    if (tries === 1) record(cur.ex, false);
    if (mode === 'tijd') {
      locked = true; wrongN++;
      if (btn) btn.classList.add('bad');
      if (w.reveal) w.reveal();
      fb.className = 'feedback bad';
      fb.innerHTML = `Het goede antwoord is <b>${fr(cur.a, cur)}</b>`;
      i++; timeout = setTimeout(next, 1500);
      return;
    }
    if (tries === 1) {
      if (btn && w.wrong) w.wrong(btn);
      fb.className = 'feedback bad';
      fb.innerHTML = `Bijna! Probeer het nog eens. <div class="hint">💡 ${cur.hint}</div>`;
      $('.qcard', el).classList.add('shake'); setTimeout(() => $('.qcard', el).classList.remove('shake'), 400);
      if (w.reset) w.reset();
    } else {
      locked = true;
      if (btn) btn.classList.add('bad');
      fb.className = 'feedback bad';
      fb.innerHTML = `Het goede antwoord is <b>${fr(cur.a + (cur.type === 'num' && cur.unit && !cur.pre ? ' ' + cur.unit : ''), cur)}</b>. <div class="hint">💡 ${cur.hint}</div>`;
      if (w.reveal) w.reveal();
      fb.insertAdjacentHTML('beforeend', '<button class="btn primary" id="nextq">Volgende ➜</button>');
      $('#nextq').addEventListener('click', () => { i++; next(); });
      $('#nextq').focus();
    }
  }
  function finish() {
    clearInterval(timer); clearTimeout(timeout);
    $('.bar', el).style.width = '100%';
    document.removeEventListener('keydown', onKey);
    save();
    onFinish({ correct, wrong: wrongN, total: mode === 'tijd' ? correct + wrongN : total, items });
  }
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey || !w) return;
    if (e.key === 'Enter') { const n = $('#nextq'); if (n) n.click(); else w.key('ok'); e.preventDefault(); return; }
    if (w.choice) { if (/^[1-4]$/.test(e.key)) w.key(e.key); return; }
    if (/^\d$/.test(e.key)) w.key(e.key);
    else if (e.key === ',' || e.key === '.') w.key(',');
    else if (e.key === '/' && cur.frac) w.key('/');
    else if (e.key === ' ' && cur.frac) { w.key(' '); e.preventDefault(); }
    else if (e.key === 'Backspace') w.key('⌫');
  }
  document.addEventListener('keydown', onKey);
  if (mode === 'tijd') {
    $('.bar', el).style.width = '100%';
    timer = setInterval(() => {
      const left = Math.max(0, end - Date.now());
      $('.bar', el).style.width = (left / (sec * 1000) * 100) + '%';
      $('.bar', el).classList.toggle('low', left < 10000);
      if (left <= 0) finish();
    }, 100);
  }
  next();
  return () => { clearTimeout(timeout); clearInterval(timer); document.removeEventListener('keydown', onKey); };
}

    ${first ? '<div class="emoji huge">🚀</div><h1>Welkom bij Rekenraket!</h1><p>Oefen alles van rekenen in groep 1 tot en met 8: uitleg, oefenen, toetsen en spelletjes.</p>' : '<h1>Mijn profiel</h1>'}
    <form id="pf">
      <label>Hoe heet je?<input name="name" maxlength="20" required autocomplete="off" value="${esc(p.name)}" placeholder="Je voornaam"></label>
      <fieldset><legend>In welke groep zit je?</legend><div class="grp">${GROEPEN.map(g => `<label class="g${g}"><input type="radio" name="groep" value="${g}" ${g === p.groep ? 'checked' : ''}><span>${g}</span></label>`).join('')}</div></fieldset>
      <label>Welke rekenmethode gebruikt je school? <small class="muted">(mag je overslaan)</small>
        <select name="methode"><option value="">Weet ik niet / geen</option>${methods.map(m => `<option value="${m.id}" ${p.methode === m.id ? 'selected' : ''}>${m.title}</option>`).join('')}</select></label>
      <fieldset><legend>Kies je maatje</legend><div class="av">${AVATARS.map(a => `<label><input type="radio" name="avatar" value="${a}" ${a === p.avatar ? 'checked' : ''}><span>${a}</span></label>`).join('')}</div></fieldset>
      <button class="btn big primary" type="submit">${first ? 'Beginnen! 🚀' : 'Opslaan'}</button>
    </form>
    ${first ? '' : '<hr><button class="btn danger" id="reset">Alle voortgang wissen</button>'}</div>`;
  $('#pf').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const groep = +f.get('groep');
    if (S.profile && S.profile.groep !== groep) S.filter = groep;
    S.profile = { name: String(f.get('name')).trim().slice(0, 20) || 'Rekenaar', groep, avatar: f.get('avatar'), methode: f.get('methode') || '' };
    if (S.filter == null) S.filter = groep;
    save(); beep('good');
    if (location.hash === '#/' || !location.hash) route(); else location.hash = '#/';
  });
  const r = $('#reset');
  if (r) r.addEventListener('click', () => {
    if (r.dataset.sure) { const prof = S.profile; S = fresh(); S.profile = prof; save(); location.hash = '#/'; return; }
    r.dataset.sure = '1';
    r.textContent = 'Zeker weten? Tik nog een keer om alles te wissen';
    setTimeout(() => { delete r.dataset.sure; r.textContent = 'Alle voortgang wissen'; }, 5000);
  });
}

/* ---------- installeren (PWA) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; renderInstall(); });
function renderInstall() {
  const box = $('#install');
  if (!box) return;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (standalone) { box.innerHTML = ''; return; }
  if (installEvt) {
    box.innerHTML = '<div class="card install"><span class="emoji">📲</span><div><b>Zet Rekenraket op je tablet of telefoon</b><small>Dan werkt hij ook zonder internet.</small></div><button class="btn primary" id="inst">Installeren</button></div>';
    $('#inst').addEventListener('click', async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; renderInstall(); });
  } else if (ios) {
    box.innerHTML = '<div class="card install"><span class="emoji">📲</span><div><b>Zet Rekenraket op je beginscherm</b><small>Tik op <b>Deel</b> ⬆️ en kies <b>Zet op beginscherm</b>.</small></div></div>';
  } else box.innerHTML = '';
}

if (false) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

route();

</script>
